<!DOCTYPE html>
<!-- Source for assets/HM-og-v2.png, the 1200x630 link-preview image.
     Render it from the repo root with scripts/make-og.sh. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: Grift; src: url(../fonts/Grift-Black.woff2); font-weight: 900; }
  @font-face { font-family: Grift; src: url(../fonts/Grift-Medium.woff2); font-weight: 500; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0F1419; color: #F2E8D5; font-family: Grift, sans-serif;
         display: grid; grid-template-columns: 520px 1fr; align-items: center; }
  .badge { width: 470px; height: 470px; object-fit: contain; justify-self: center; }
  .text { padding-right: 70px; }
  .eyebrow { font-weight: 500; font-size: 22px; letter-spacing: .22em; text-transform: uppercase; color: #E0A458; }
  h1 { font-weight: 900; font-size: 74px; line-height: .98; margin: 18px 0 0; }
  .rule { width: 80px; height: 5px; background: #B7280F; margin: 30px 0; }
  p { font-weight: 500; font-size: 30px; line-height: 1.3; margin: 0; color: #F2E8D5; }
  .where { margin-top: 26px; font-size: 20px; letter-spacing: .18em; text-transform: uppercase; color: #8CA3B5; }
</style>
</head>
<body>
  <img class="badge" src="../assets/HM-badge-full.png" alt="">
  <div class="text">
    <div class="eyebrow">Design &middot; Disrupt &middot; Deliver</div>
    <h1>The Intelligent Hoodlums</h1>
    <div class="rule"></div>
    <p>We help teachers solve problems.</p>
    <div class="where">Las Vegas &middot; Est 2014</div>
  </div>
</body>
</html>
