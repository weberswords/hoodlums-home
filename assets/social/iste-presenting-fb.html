<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ISTELive 26 — We're Presenting · The Intelligent Hoodlums</title>
<style>
  /* ── Grift display family (local) ───────────────────────── */
  @font-face { font-family:'Grift'; src:url('../../fonts/Grift-Black.woff2') format('woff2'); font-weight:900; font-style:normal; }
  @font-face { font-family:'Grift'; src:url('../../fonts/Grift-Bold.woff2')  format('woff2'); font-weight:700; font-style:normal; }
  @font-face { font-family:'Grift'; src:url('../../fonts/Grift-SemiBold.woff2') format('woff2'); font-weight:600; font-style:normal; }

  :root{
    --ink:#0F1419; --prussian:#0B2545; --rufous:#B7280F;
    --tuscany:#E0A458; --bone:#F2E8D5; --cadet:#8CA3B5;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }

  /* Facebook feed / link image: 1200 × 630 */
  .card{
    width:1200px; height:630px; position:relative; overflow:hidden;
    background:var(--ink); color:var(--bone);
    font-family:'Helvetica Neue', Arial, sans-serif;
  }

  /* Ben-day halftone field */
  .card::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image:radial-gradient(circle, var(--bone) 1px, transparent 1px);
    background-size:9px 9px; opacity:0.06;
  }

  /* Left rufous stripe + thin bone frame (print plate feel) */
  .stripe{ position:absolute; left:0; top:0; bottom:0; width:8px; background:var(--rufous); }
  .frame{ position:absolute; inset:26px; border:1px solid rgba(242,232,213,0.18); pointer-events:none; }

  .stage{
    position:relative; z-index:2; height:100%;
    display:flex; align-items:center; gap:64px;
    padding:64px 72px 64px 96px;
  }

  .badge{ width:300px; height:300px; flex-shrink:0; object-fit:contain;
          filter:drop-shadow(0 0 0 transparent); }

  .copy{ flex:1; }

  .kicker{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-weight:700; font-size:17px; letter-spacing:0.22em;
    text-transform:uppercase; color:var(--tuscany);
    display:flex; align-items:center; gap:14px;
  }
  .kicker .dot{ width:9px; height:9px; background:var(--tuscany); border-radius:999px; }

  h1{
    font-family:'Grift', sans-serif; font-weight:900; text-transform:uppercase;
    color:var(--bone); line-height:0.92; letter-spacing:0.01em;
    margin:18px 0 0;
  }
  h1 .line1{ display:block; font-size:54px; color:rgba(242,232,213,0.92); }
  h1 .line2{ display:block; font-size:104px; color:var(--tuscany); margin-top:2px; }

  .rule{ width:72px; height:4px; background:var(--rufous); border:0; margin:26px 0 22px; }

  .meta{
    font-family:'Grift', sans-serif; font-weight:700;
    font-size:24px; letter-spacing:0.02em; color:var(--bone);
  }
  .hook{
    font-family:'Helvetica Neue', Arial, sans-serif; font-weight:400;
    font-size:19px; line-height:1.5; color:rgba(242,232,213,0.66);
    margin-top:12px; max-width:560px;
  }

  /* Bottom strip */
  .strip{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 40px; background:var(--prussian);
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:13px; letter-spacing:0.14em; text-transform:uppercase;
  }
  .strip .left{ color:var(--bone); font-weight:600; }
  .strip .right{ color:var(--tuscany); font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <div class="stripe"></div>
    <div class="frame"></div>

    <div class="stage">
      <img class="badge" src="../HM-badge-full.png" alt="The Intelligent Hoodlums badge">
      <div class="copy">
        <div class="kicker"><span class="dot"></span>June 28 – July 1 · Orlando, FL</div>
        <h1>
          <span class="line1">We're presenting at</span>
          <span class="line2">ISTELive&nbsp;26</span>
        </h1>
        <hr class="rule">
        <div class="meta">Find us on the floor. Design. Disrupt. Deliver.</div>
        <p class="hook">We're bringing instruction that survives a Tuesday to the
        biggest stage in edtech. Pull up — let's build.</p>
      </div>
    </div>

    <div class="strip">
      <span class="left">The Intelligent Hoodlums</span>
      <span class="right">When in doubt, trust a Hoodlum.</span>
    </div>
  </div>
</body>
</html>
